name = "waline-edgeone"
compatibility_date = "2024-01-01"

# ============================================
# EdgeOne Pages Functions Configuration
# ============================================

# 注意：EdgeOne Pages 会自动识别 functions 目录下的 index.js 作为入口
# 无需额外配置 main 字段

# KV Namespace Binding
# 在 EdgeOne 控制台设置：Pages -> 你的项目 -> 设置 -> 变量
# 变量名称：WALINE_KV
# KV 命名空间：选择你创建的命名空间
[[kv_namespaces]]
binding = "WALINE_KV"
id = "your_kv_namespace_id_here"

# ============================================
# 必需环境变量
# 在 EdgeOne 控制台设置：Pages -> 你的项目 -> 设置 -> 变量
# ============================================

# JWT Secret (必需，用于认证)
# 生成随机字符串：openssl rand -base64 32
# [vars]
# JWT_TOKEN = "your-random-secret-key"

# 管理员账号 (必需，首次登录用)
# [vars]
# ADMIN_EMAIL = "admin@example.com"
# ADMIN_PASSWORD_HASH = "sha256-hash-of-password"

# 站点配置
# [vars]
# SITE_NAME = "My Blog"
# SITE_URL = "https://your-domain.com"

# ============================================
# 可选环境变量
# ============================================

# 评论设置
# COMMENT_AUDIT = "false"
# DISABLE_USERAGENT = "false"
# DISABLE_REGION = "false"
# IP_QPS = "60"
# LIKE_INC_MAX = "10"

# 用户等级
# LEVELS = "0,10,20,50,100,200"

# 安全设置
# DISALLOW_IP_LIST = "1.2.3.4,5.6.7.8"
# FORBIDDEN_WORDS = "spam,badword"

# 头像代理
# AVATAR_PROXY = "https://your-proxy.com"

# 反垃圾
# AKISMET_KEY = "your-akismet-key"

# SMTP 邮件通知
# SMTP_HOST = "smtp.gmail.com"
# SMTP_PORT = "465"
# SMTP_SECURE = "true"
# SMTP_USER = "your-email@gmail.com"
# SMTP_PASS = "your-app-password"
# SMTP_SERVICE = "Gmail"
# SENDER_EMAIL = "noreply@example.com"
# SENDER_NAME = "Waline"

# 其他通知渠道
# SC_KEY = "serverchan-key"
# TG_BOT_TOKEN = "telegram-token"
# TG_CHAT_ID = "chat-id"
# QQ_KEY = "coolpush-key"
# DISCORD_WEBHOOK = "webhook-url"
# LARK_WEBHOOK = "lark-webhook"

# OAuth 代理 (默认使用官方)
# OAUTH_URL = "https://oauth.lithub.cc"
